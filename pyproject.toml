[project]
name = "darglobal-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
darglobal-project = "darglobal_project:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "crawl4ai>=0.9.5",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
